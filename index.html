<style>
  :root{
    /* Плоскости и чернила */
    --plane:#f4f4f2; --surface:#ffffff; --surface-2:#fbfbfa;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --line:rgba(11,11,11,.09); --line-soft:rgba(11,11,11,.05);

    /* Акцент (sequential blue из палитры dataviz) */
    --accent:#2a78d6; --accent-600:#256abf; --accent-700:#184f95;
    --accent-100:#cde2fb; --accent-050:#eaf2fd;

    /* Статусы: используются только вместе с текстовой меткой */
    --good:#0ca30c; --warn:#c98500; --serious:#ec835a; --crit:#d03b3b;

    --sh-1:0 1px 2px rgba(11,11,11,.05);
    --sh-2:0 1px 2px rgba(11,11,11,.05), 0 10px 28px -14px rgba(11,11,11,.28);
    --sh-3:0 2px 4px rgba(11,11,11,.06), 0 22px 44px -20px rgba(11,11,11,.34);

    --r:14px; --r-sm:9px; --r-pill:999px;
    --head:"Oswald","Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.2,.7,.25,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--plane); color:var(--ink);
    font:15px/1.6 var(--body); -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent-100)}
  .tab{font-variant-numeric:tabular-nums}

  /* ─────────── Полоса прогресса чтения ─────────── */
  .progress{position:fixed;inset:0 auto auto 0;height:2px;width:0;z-index:60;
    background:linear-gradient(90deg,var(--accent),var(--accent-700));transition:width .12s linear}

  /* ─────────── Шапка ─────────── */
  .bar{position:sticky;top:0;z-index:50;display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:22px;
    padding:12px 26px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid var(--line);transition:box-shadow .3s var(--ease),padding .3s var(--ease)}
  .bar.stuck{box-shadow:var(--sh-2);padding-top:9px;padding-bottom:9px}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;text-decoration:none;color:inherit}
  .mark{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-700));color:#fff;
    box-shadow:0 6px 16px -8px var(--accent);transition:transform .5s var(--ease)}
  .brand:hover .mark{transform:rotate(-8deg) scale(1.06)}
  .mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
  .brand > span{display:block;min-width:0;overflow:hidden}
  .brand .t{display:block;font-family:var(--head);font-weight:600;font-size:19px;line-height:1.05;
    letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .s{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .search{position:relative;justify-self:center;width:100%;max-width:460px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;
    fill:none;stroke:var(--muted);stroke-width:2;pointer-events:none;transition:stroke .2s}
  .search input{width:100%;background:var(--surface-2);border:1px solid var(--line);
    border-radius:var(--r-pill);padding:10px 40px 10px 36px;font:14px var(--body);color:var(--ink);
    transition:border-color .2s var(--ease),box-shadow .25s var(--ease),background .2s}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;background:var(--surface);border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-050)}
  .search input:focus + svg{stroke:var(--accent)}
  .search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%) scale(.7);
    width:26px;height:26px;border:none;border-radius:50%;background:var(--line-soft);color:var(--ink-2);
    cursor:pointer;font:15px/1 var(--body);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s var(--ease),background .2s}
  .search.has .clr{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
  .search .clr:hover{background:var(--accent-100)}

  .tools{display:flex;align-items:center;gap:12px}
  .live{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--r-pill);
    background:var(--accent-050);color:var(--accent-700);
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--accent);position:relative}
  .live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);
    animation:ping 2.2s var(--ease) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3);opacity:0}}
  .seg{display:flex;padding:3px;gap:2px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:var(--r-pill)}
  .seg button{border:none;background:none;cursor:pointer;padding:5px 12px;border-radius:var(--r-pill);
    font:600 12px var(--body);color:var(--muted);transition:color .2s,background .3s var(--ease)}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* ─────────── Бегущая строка ─────────── */
  .wire{display:flex;align-items:center;gap:16px;padding:0 0 0 26px;
    background:var(--ink);color:#fff;overflow:hidden}
  .wire .lbl{flex:none;font-family:var(--head);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent-100)}
  .wire .win{flex:1;overflow:hidden;padding:9px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 60px),transparent);
            mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 60px),transparent)}
  .track{display:flex;gap:34px;white-space:nowrap;width:max-content;animation:marquee 46s linear infinite}
  .wire:hover .track{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .track span{font-size:12.5px;color:rgba(255,255,255,.62)}
  .track b{color:#fff;font-weight:600}
  .track button{border:none;background:none;padding:0;cursor:pointer;color:#fff;font:600 12.5px var(--body);
    border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
  .track button:hover{border-bottom-color:var(--accent-100);color:var(--accent-100)}
  .track em{font-style:normal;color:var(--accent-100);margin:0 6px}

  /* ─────────── Общая раскладка ─────────── */
  .wrap{max-width:1360px;margin:0 auto;padding:0 26px}
  section{scroll-margin-top:80px}

  /* ─────────── Hero ─────────── */
  .hero{position:relative;padding:52px 0 34px;overflow:hidden}
  .hero::before{content:"";position:absolute;width:620px;height:620px;right:-180px;top:-300px;
    background:radial-gradient(circle,var(--accent-050),transparent 65%);pointer-events:none;
    animation:drift 22s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(-60px,50px) scale(1.15)}}
  .hero .grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
    gap:44px;align-items:center}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-size:11.5px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--accent-600);margin-bottom:16px}
  .kicker::before{content:"";width:26px;height:1px;background:var(--accent)}
  h1{font-family:var(--head);font-weight:600;font-size:clamp(34px,4.4vw,56px);line-height:1.02;
    letter-spacing:-.01em;text-transform:uppercase;margin-bottom:16px}
  h1 .hl{color:var(--accent);position:relative;white-space:nowrap}
  h1 .hl::after{content:"";position:absolute;left:0;right:0;bottom:.08em;height:.11em;
    background:var(--accent-100);z-index:-1;transform:scaleX(0);transform-origin:left;
    animation:sweep .9s .5s var(--ease) forwards}
  @keyframes sweep{to{transform:scaleX(1)}}
  .lead{font-size:16.5px;color:var(--ink-2);max-width:46ch}
  .heroCta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  .btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r-pill);
    padding:11px 20px;background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;
    font:600 13.5px var(--body);transition:transform .25s var(--ease),box-shadow .25s var(--ease),
      border-color .2s,background .2s,color .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:transparent}
  .btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.p:hover{background:var(--accent);border-color:var(--accent)}
  .btn.tg-btn{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 8px 20px -12px var(--accent)}
  .btn.tg-btn:hover{background:var(--accent-600);border-color:var(--accent-600)}
  .tgCaption{align-self:center;font-size:13.5px;color:var(--ink-2);max-width:22ch;line-height:1.3}
  .btn svg{width:15px;height:15px;flex:none;fill:currentColor}
  #ctaTg span{white-space:nowrap}

  /* Плитки KPI */
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
    box-shadow:var(--sh-1);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
  .tile .l{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--body);font-weight:600;font-size:34px;line-height:1.1;margin-top:4px}
  .tile .m{font-size:12px;color:var(--ink-2)}
  .tile .m i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;
    vertical-align:middle}

  /* График активности */
  .chartCard{grid-column:1 / -1;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:16px 18px 12px;box-shadow:var(--sh-1);position:relative}
  .chartCard .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .chartCard .hd .t{font-family:var(--head);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .chartCard .hd .s{font-size:11.5px;color:var(--muted)}
  .plot{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:86px;
    padding-top:12px;border-bottom:1px solid var(--line);position:relative}
  .plot::before{content:"";position:absolute;left:0;right:0;top:12px;border-top:1px dashed var(--line-soft)}
  .col{flex:1;max-width:24px;height:100%;display:flex;align-items:flex-end;cursor:default;position:relative}
  .col .fill{width:100%;background:var(--accent-100);border-radius:4px 4px 0 0;height:2px;
    transition:height .75s var(--ease),background .2s;transform-origin:bottom}
  .col[data-v]:not([data-v="0"]) .fill{background:var(--accent)}
  .col:hover .fill{background:var(--accent-700)}
  .xax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px}
  .tip{position:absolute;z-index:5;padding:6px 10px;border-radius:8px;background:var(--ink);color:#fff;
    font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-4px);
    transition:opacity .16s,transform .16s var(--ease)}
  .tip.on{opacity:1;transform:translate(-50%,-10px)}
  .tip b{font-weight:600}

  /* ─────────── Панель управления ─────────── */
  .controls{z-index:40;background:rgba(244,244,242,.9);
    backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line);
    padding:12px 0}
  /* ─────────── Меню разделов ─────────── */
  .nav{position:sticky;top:var(--barh,64px);z-index:45;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
  .nav .wrap::-webkit-scrollbar{display:none}
  .navItem{position:relative;flex:none;display:flex;align-items:center;gap:8px;
    padding:14px 16px;border:none;background:none;cursor:pointer;white-space:nowrap;
    font:500 14px var(--body);color:var(--n600);transition:color .2s}
  .navItem:hover{color:var(--ink)}
  .navItem::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;
    background:var(--accent);transform:scaleX(0);transform-origin:center;
    transition:transform .3s var(--ease)}
  .navItem:hover::after{transform:scaleX(.4)}
  .navItem[aria-pressed="true"]{color:var(--ink);font-weight:600}
  .navItem[aria-pressed="true"]::after{transform:scaleX(1)}
  .navItem .c{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);
    background:var(--line-soft);border-radius:var(--r-pill);padding:2px 8px;transition:background .25s,color .25s}
  .navItem[aria-pressed="true"] .c{background:var(--accent-050);color:var(--accent-700)}
  .navSep{flex:none;align-self:center;width:1px;height:20px;background:var(--line);margin:0 10px}

  /* ─────────── Матчи ─────────── */
  .dayRow .prow button{min-width:96px;text-align:center;display:block}
  .dayRow .prow button b{display:block;margin:0;font-size:11px;color:var(--muted);font-weight:500}
  .dayRow .prow button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .dayRow .prow button[aria-pressed="true"] b{color:rgba(255,255,255,.6)}

  .evt{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  .evt:first-child{margin-top:0}
  .evt .name{font-family:var(--head);font-size:15px;letter-spacing:.05em;text-transform:uppercase}
  .evt .ln{flex:1;height:1px;background:var(--line)}
  .evt .n{font-size:11.5px;color:var(--muted)}

  .mtable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:clip;box-shadow:var(--sh-1)}
  .mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;
    padding:9px 14px;border-bottom:1px solid var(--line-soft);transition:background .2s}
  .mrow:last-child{border-bottom:none}
  .mrow:hover{background:var(--surface-2)}
  .mrow .tm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mrow .pair{display:flex;flex-direction:column;gap:3px;min-width:0}
  .mrow .side{display:flex;align-items:center;gap:8px;min-width:0}
  .mrow .side .nm{flex:0 1 auto}
  .mrow .side.win .nm{font-weight:600}
  .mrow .nm{border:none;background:none;padding:0;cursor:pointer;font:14px var(--body);color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
  .mrow .nm:hover{color:var(--accent-700);border-bottom-color:var(--accent)}
  .mrow .sd{flex:none;font-size:10.5px;color:var(--muted)}
  .mrow .flag{flex:none;width:6px;height:6px;border-radius:50%;background:var(--line)}
  .mrow .sets{margin-left:auto;display:flex;gap:2px;padding-left:14px}
  .mrow .st{min-width:22px;text-align:center;font-size:13.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .mrow .st.w{color:var(--ink);font-weight:600}
  .mrow .st sup{font-size:9px;vertical-align:super;color:var(--muted);margin-left:1px}
  .mrow .od{display:flex;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mrow .od span{border:1px solid var(--line-soft);border-radius:5px;padding:2px 7px;background:var(--surface-2)}

  /* ─────────── Рейтинг ─────────── */
  .rtable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:clip;box-shadow:var(--sh-1)}
  .rhead,.rrow{display:grid;grid-template-columns:56px 40px minmax(0,1fr) 96px 108px;
    gap:12px;align-items:center;padding:9px 16px}
  .rhead{background:var(--surface-2);border-bottom:1px solid var(--line);
    font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    position:sticky;top:var(--stick,110px);z-index:5}
  .rrow{border-bottom:1px solid var(--line-soft);transition:background .2s}
  .rrow:last-child{border-bottom:none}
  .rrow:hover{background:var(--surface-2)}
  .rrow .pos{font-family:var(--head);font-size:16px;font-variant-numeric:tabular-nums}
  .rrow .mv{font-size:11.5px;font-variant-numeric:tabular-nums}
  .rrow .mv.up{color:#0a6b0a}
  .rrow .mv.dn{color:var(--crit)}
  .rrow .mv.same{color:#cfcfcb}
  .rrow .who{display:flex;align-items:baseline;gap:8px;min-width:0}
  .rrow .who button{border:none;background:none;padding:0;cursor:pointer;font:500 14.5px var(--body);
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
  .rrow .who button:hover{color:var(--accent-700);border-bottom-color:var(--accent)}
  .rrow .ctry{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .rhead .pts,.rrow .pts{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .rhead .def,.rrow .def{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
  .rrow .def.zero{color:var(--muted)}
  .rmore{display:block;width:100%;padding:13px;border:none;background:var(--surface-2);cursor:pointer;
    font:600 13px var(--body);color:var(--accent-700);transition:background .2s}
  .rmore:hover{background:var(--accent-050)}
  .rnote{margin-bottom:14px;font-size:12.5px;color:var(--muted)}

  /* ─────────── Фото и профиль в карточке ─────────── */
  .sheet .prof{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start;
    margin-bottom:16px}
  .sheet .ph{width:96px;height:96px;border-radius:var(--r);overflow:hidden;background:var(--surface-2);
    border:1px solid var(--line);display:grid;place-items:center}

<script>
let LANG = "ru";


/* Статусные цвета: всегда идут в паре с текстовой меткой, цвет ничего не несёт в одиночку. */
const KIND_COLOR = {
  injury:     {k:"#d03b3b", kb:"rgba(208,59,59,.10)",  kt:"#a82f2f"},
  withdrawal: {k:"#e39100", kb:"rgba(227,145,0,.12)",  kt:"#8a5b00"},
  returning:  {k:"#0ca30c", kb:"rgba(12,163,12,.11)",  kt:"#0a6b0a"},
  condition:  {k:"#2a78d6", kb:"#eaf2fd",              kt:"#1c5cab"},
  all:        {k:"#0b0b0b", kb:"rgba(11,11,11,.06)",   kt:"#0b0b0b"},
  starred:    {k:"#e39100", kb:"rgba(227,145,0,.12)",  kt:"#8a5b00"},
  men:        {k:"#2a78d6", kb:"#eaf2fd",              kt:"#1c5cab"},
  women:      {k:"#e87ba4", kb:"rgba(232,123,164,.14)",kt:"#a63f68"},
};

const TABS = ["atp","wta","wd","fade","matches","ranking"];
const KINDS_MATCH = ["all","men","women"];
const KINDS_RANK = ["men","women"];

/* Данные вкладок «Матчи» и «Рейтинг» лежат отдельными файлами: если сборщик
   не отработал, страница всё равно должна открыться. */
const RANK = (typeof RANKING !== "undefined") ? RANKING : {atp:[], wta:[]};
const GAMES = (typeof MATCHES !== "undefined") ? MATCHES : [];
const PHOTO = (typeof PHOTOS !== "undefined") ? PHOTOS : {};
RANK.atp.forEach(r => r.tour = "atp");      // в файле рейтинга тура нет, он задан ключом
RANK.wta.forEach(r => r.tour = "wta");
const RANK_ALL = [...RANK.atp, ...RANK.wta];

const nkey = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z]+/g, " ").trim().split(" ").filter(w => w.length > 1).sort().join(" ");
const BY_SLUG = new Map(RANK_ALL.map(r => [r.slug, r]));
const BY_NAME = new Map(RANK_ALL.map(r => [nkey(r.name), r]));
const rowFor = id => BY_SLUG.get(id) || BY_NAME.get(nkey(id)) || null;
const idOfPlayer = who => (rowFor(who) || {}).slug || who;

let mday = 0;                     // выбранный день в расписании
const KINDS_TOUR = ["all","injury","withdrawal","returning","condition","starred"];
const KINDS_WD = ["all","men","women","starred"];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

let TAB = "atp", filter = "all", query = "", rankShown = 100;
const starred = new Set();

const $ = id => document.getElementById(id);
const nameOf = n => (LANG === "ru" && n.whoRu) ? n.whoRu : n.who;
const idOf = n => n.ts + n.who;
const dayKey = ts => ts.split(" ")[0];
const badgeOf = n => t("k" + n.kind[0].toUpperCase() + n.kind.slice(1));

/* Счётные формы: "1 record" / "2 записи" / "5 записей". */
function recWord(n){
  if (LANG !== "ru") return n === 1 ? "record" : "records";
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "запись";
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return "записи";
  return "записей";
}
const recs = n => n + " " + recWord(n);

function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("on"), 2200);
}

/* file:// не даёт доступа к navigator.clipboard, поэтому запасной путь обязателен. */
function copyText(txt){
  const done = () => toast(t("copied"));
  const legacy = () => {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(txt).then(done, legacy);
  else legacy();
}

/* Готовый текст для поста в канал. */
function postText(n){
  const nm = nameOf(n);
  const who = nm + (n.rank !== null ? " \u00b7 #" + n.rank + " " : " \u00b7 ") + n.tour.toUpperCase();
  const body = n[LANG].replace(/<[^>]+>/g, "");
  const repl = (LANG === "ru" && n.replRu) ? n.replRu : n.repl;
  return "\ud83c\udfbe " + who + "\n" +
    (TOURN[n.code] || n.code) + " \u00b7 " + labelOfKey(dayKey(n.ts)) + "\n\n" +
    nm + " " + body + "\n" +
    (repl ? t("replacedBy") + " " + repl + "\n" : "") +
    "\n" + n.srcName + ": " + n.src + "\n\n@tennismedical";
}

/* Счётные формы для сигналов риска. */
function sigWord(n){
  if (LANG !== "ru") return n === 1 ? "signal" : "signals";
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "сигнал";
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return "сигнала";
  return "сигналов";
}

function daysAgo(ts){
  const d = new Date(ts.replace(" ", "T"));
  return Math.max(0, Math.round((Date.now() - d) / 86400000));
}
function labelOfKey(key){
  const [y,m,d] = key.split("-");
  return `${Number(d)} ${UI[LANG].months[Number(m)-1]} ${y}`;
}

/* ─────────── Оценка риска: «против кого ставить» ───────────
   Вес сигнала × затухание по времени. Никакой магии: это арифметика
   по тем же записям ленты, а не прогноз матча. */
const SIG_W = {retired:42, mto:34, illness:26, wd_mid:24, wd_pre:18, return:14, condition:12, rest:8};
const decay = d => Math.max(0.2, 1 - d / 21);
const REPEAT_MIN = 2;   // два сообщения об одном эпизоде подряд — это не повтор

function drawStatus(n){
  if (DRAW.seeds[n.who] != null) return "seed";
  if (DRAW.other.includes(n.who)) return "in";
  if (n.rank !== null && n.rank <= DRAW.cutoff) return "likely";
  return null;
}

function fadeList(){
  const byPlayer = new Map();
  for (const n of NEWS){
    if (!SIG_W[n.sig]) continue;
    byPlayer.set(n.who, [...(byPlayer.get(n.who) || []), n]);
  }
  const out = [];
  for (const [who, recs] of byPlayer){
    if (recs.some(n => n.out)) continue;                                       // отстранение или пауза в карьере
    if (recs.some(n => n.code === "USO" && n.kind === "withdrawal")) continue; // уже вне турнира
    const status = drawStatus(recs[0]);
    if (!status) continue;
    const sorted = [...recs].sort((a,b) => b.ts.localeCompare(a.ts));
    if (daysAgo(sorted[0].ts) > 30 && status !== "seed") continue;
    let score = 0;
    for (const n of recs) score += SIG_W[n.sig] * decay(daysAgo(n.ts));
    const asc = [...sorted].reverse();
    const repeat = asc.some((n, i) => {
      const next = asc[i + 1];
      if (!next) return false;
      const g = gapDays(next, n);
      return g >= REPEAT_MIN && g <= 21 && daysAgo(next.ts) <= 21;
    });
    if (repeat) score += 10;
    out.push({who, tour:recs[0].tour, rank:recs[0].rank, recs:sorted, status,
              seed:DRAW.seeds[who] ?? null, score:Math.min(100, Math.round(score))});
  }
  return out.sort((a,b) => b.score - a.score || a.who.localeCompare(b.who));
}

/* Проверка модели: как часто за сигналом в течение 14 дней следовал ещё один. */
function gapDays(a, b){
  return Math.round((new Date(a.ts.replace(" ", "T")) - new Date(b.ts.replace(" ", "T"))) / 86400000);
}

function backtest(){
  const by = new Map();
  for (const n of NEWS) if (SIG_W[n.sig]) by.set(n.who, [...(by.get(n.who) || []), n]);
  let evaluated = 0, repeated = 0;
  for (const [, list] of by){
    const sorted = [...list].sort((a,b) => a.ts.localeCompare(b.ts));
    sorted.forEach((n, i) => {
      const next = sorted[i + 1];
      const g = next ? gapDays(next, n) : null;
      if (g !== null && g >= REPEAT_MIN && g <= 14){ evaluated++; repeated++; }
      else if (daysAgo(n.ts) >= 14) evaluated++;
    });
  }
  return {evaluated, repeated, pct: evaluated ? Math.round(repeated / evaluated * 100) : 0};
}

function fadeMatch(f){
  const q = query.trim().toLowerCase();
  if (filter === "men" && f.tour !== "atp") return false;
  if (filter === "women" && f.tour !== "wta") return false;
  if (!q) return true;
  const ru = f.recs[0].whoRu || "";
  return f.who.toLowerCase().includes(q) || ru.toLowerCase().includes(q);
}

/* Вкладка задаёт набор записей: тур + топ-250, либо все снятия обоих туров. */
function scope(){
  if (TAB === "matches" || TAB === "ranking") return [];
  if (TAB === "fade"){
    const names = new Set(fadeList().map(f => f.who));
    return NEWS.filter(n => names.has(n.who) && SIG_W[n.sig]);
  }
  return NEWS.filter(n => {
    if (TAB === "wd") return n.kind === "withdrawal";
    if (n.tour !== TAB) return false;
    return n.rank === null || n.rank <= 250;
  });
}

function match(n){
  const q = query.trim().toLowerCase();
  if (filter === "starred" && !starred.has(idOf(n))) return false;
  if (TAB === "wd"){
    if (filter === "men" && n.tour !== "atp") return false;
    if (filter === "women" && n.tour !== "wta") return false;
  } else if (filter !== "all" && filter !== "starred" && n.kind !== filter){
    return false;
  }
  if (!q) return true;
  return n.who.toLowerCase().includes(q) ||
         (n.whoRu || "").toLowerCase().includes(q) ||
         (TOURN[n.code] || "").toLowerCase().includes(q) ||
         n[LANG].toLowerCase().includes(q);
}

const kindsNow = () => TAB === "ranking" ? KINDS_RANK
  : TAB === "matches" ? KINDS_MATCH
  : (TAB === "wd" || TAB === "fade") ? KINDS_WD : KINDS_TOUR;

function countOf(k){
  if (TAB === "matches"){
    const list = dayGames();
    return k === "all" ? list.length : list.filter(m => m.tour === (k === "men" ? "atp" : "wta")).length;
  }
  if (TAB === "ranking") return (k === "men" ? RANK.atp : RANK.wta).length;
  const s = scope();
  if (k === "all") return s.length;
  if (k === "starred") return s.filter(n => starred.has(idOf(n))).length;
  if (k === "men") return s.filter(n => n.tour === "atp").length;
  if (k === "women") return s.filter(n => n.tour === "wta").length;
  return s.filter(n => n.kind === k).length;
}

/* ─────────── Вкладки ─────────── */
function renderTabs(){
  const count = tab => {
    if (tab === "matches") return GAMES.length;
    if (tab === "ranking") return RANK_ALL.length;
    if (tab === "fade") return fadeList().length;
    const keep = TAB; TAB = tab; const c = scope().length; TAB = keep; return c;
  };
  const label = {atp:"tabAtp", wta:"tabWta", wd:"tabWd", fade:"tabFade",
                 matches:"tabMatches", ranking:"tabRanking"};
  $("tabs").innerHTML = TABS.map(tab =>
    /* черта отделяет ленту травм от общетеннисных разделов */
    (tab === "matches" ? '<span class="navSep"></span>' : "") +
    `<button class="navItem" data-tab="${tab}" aria-pressed="${tab === TAB}">
        <span class="n">${t(label[tab])}</span>
        <span class="c">${count(tab)}</span>
      </button>`).join("");
}

/* ─────────── Плитки со сводкой ─────────── */
function animateNum(el, to){
  if (REDUCED){ el.textContent = to; return; }
  const dur = 900, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const fadeShare = (fl, tour) => (fl.length ? Math.round(fl.filter(f => f.tour === tour).length / fl.length * 100) : 0) + "% " + t("ofTotal");

function renderTiles(){
  const s = scope();
  const newest = s.length ? s.reduce((a,b) => a.ts > b.ts ? a : b) : null;
  const share = n => (s.length ? Math.round(n / s.length * 100) : 0) + "% " + t("ofTotal");
  const fl = TAB === "fade" ? fadeList() : [];
  const day = TAB === "matches" ? dayGames() : [];
  const rank = TAB === "ranking" ? (filter === "women" ? RANK.wta : RANK.atp) : [];
  const tiles = TAB === "matches"
    ? [{key:"matchesToday", val:day.length,
        meta:DAYS[mday] ? labelOfKey(DAYS[mday]) : "\u2014"},
       {key:"events", val:new Set(day.map(m => m.event)).size, meta:t("tabMatchesSub")},
       {key:"men", val:day.filter(m => m.tour === "atp").length, meta:"ATP", kind:"men"},
       {key:"women", val:day.filter(m => m.tour === "wta").length, meta:"WTA", kind:"women"}]
    : TAB === "ranking"
    ? [{key:"sPlayers", val:rank.length, meta:t("tabRankingSub")},
       {key:"colPts", val:rank.length ? rank[0].points : 0, meta:rank.length ? rank[0].name : ""},
       {key:"colDef", val:rank.filter(r => r.defend).length, meta:t("profDefend"),
        kind:filter === "women" ? "women" : "men"},
       {key:filter === "women" ? "women" : "men", val:rank.filter(r => r.move > 0).length,
        meta:"\u2191 " + t("colMove"), kind:filter === "women" ? "women" : "men"}]
    : TAB === "fade"
    ? [{key:"candidates", val:fl.length, meta:t("statusNote") + " \u00b7 US Open"},
       {key:"avgScore", val:fl.length ? Math.round(fl.reduce((a,b) => a + b.score, 0) / fl.length) : 0,
        meta:t("riskScore")},
       {key:"men", val:fl.filter(f => f.tour === "atp").length,
        meta:fadeShare(fl, "atp"), kind:"men"},
       {key:"women", val:fl.filter(f => f.tour === "wta").length,
        meta:fadeShare(fl, "wta"), kind:"women"}]
    : TAB === "wd"
    ? [{key:"sTotal", val:s.length, meta:newest ? `${t("lastRec")} · ${UI[LANG].ago(daysAgo(newest.ts))}` : "—"},
       {key:"sPlayers", val:new Set(s.map(n => n.who)).size,
        meta:`${new Set(s.map(n => n.code)).size} ${t("events")}`},
       {key:"men", val:countOf("men"), meta:share(countOf("men")), kind:"men"},
       {key:"women", val:countOf("women"), meta:share(countOf("women")), kind:"women"}]
    : [{key:"sTotal", val:s.length, meta:newest ? `${t("lastRec")} · ${UI[LANG].ago(daysAgo(newest.ts))}` : "—"},
       {key:"sPlayers", val:new Set(s.map(n => n.who)).size,
        meta:`${new Set(s.map(n => n.code)).size} ${t("events")}`},
       {key:"sInj", val:countOf("injury"), meta:share(countOf("injury")), kind:"injury"},
       {key:"sWd", val:countOf("withdrawal"), meta:share(countOf("withdrawal")), kind:"withdrawal"}];

  $("tiles").innerHTML = tiles.map(x => {
    const c = KIND_COLOR[x.kind || "all"];
    return `<div class="tile">
        <div class="l">${t(x.key)}</div>
        <div class="v" data-to="${x.val}">0</div>
        <div class="m"><i style="background:${c.k}"></i>${x.meta}</div>
      </div>`;
  }).join("") + (TAB === "fade" ? `<div class="chartCard how">
      <div class="hd"><span class="t">${t("howTitle")}</span></div>
      <p class="howBody">${t("howBody")}</p>
      <div class="weights">${Object.entries(SIG_W).sort((a,b) => b[1] - a[1]).map(([k,v]) =>
        `<span class="w"><b>${v}</b>${t("sig" + k[0].toUpperCase() + k.slice(1))}</span>`).join("")}</div>
    </div>` :
  `<div class="chartCard">
      <div class="hd"><span class="t">${TAB === "matches" ? t("chartMatches") : t("chart")}</span>
        <span class="s">${TAB === "matches"
          ? t("chartMatchesHint") + " " + DAYS.length : t("chartHint")}</span></div>
      <div class="plot" id="plot"></div>
      <div class="xax" id="xax"></div>
      <div class="tip" id="tip"></div>
    </div>`);

  $("tiles").querySelectorAll(".v").forEach(el => animateNum(el, Number(el.dataset.to)));
}

/* Один ряд, одна величина — легенда не нужна, подпись графика говорит, что это. */
function renderChart(){
  if (TAB === "fade" || TAB === "ranking") return;
  if (TAB === "matches") return renderDayChart();
  const s = scope(), days = [];
  for (let i = 13; i >= 0; i--){
    const key = new Date(Date.now() - i * 86400000).toISOString().slice(0,10);
    days.push([key, s.filter(n => dayKey(n.ts) === key).length]);
  }
  const max = Math.max(1, ...days.map(d => d[1]));
  const plot = $("plot"), tip = $("tip");

  plot.innerHTML = days.map(([k,v]) =>
    `<div class="col" data-v="${v}" data-k="${k}"><div class="fill"></div></div>`).join("");

  const grow = () => plot.querySelectorAll(".col").forEach((c,i) => {
    const v = Number(c.dataset.v);
    const h = v ? Math.max(6, Math.round(v / max * 100)) : 2;
    c.querySelector(".fill").style.transitionDelay = REDUCED ? "0ms" : (i * 45) + "ms";
    c.querySelector(".fill").style.height = h + "%";
  });
  REDUCED ? grow() : requestAnimationFrame(() => requestAnimationFrame(grow));

  plot.onmouseover = e => {
    const col = e.target.closest(".col"); if (!col) return;
    tip.innerHTML = `<b>${col.dataset.v}</b> ${recWord(Number(col.dataset.v))} · ${labelOfKey(col.dataset.k)}`;
    const p = plot.getBoundingClientRect(), c = col.getBoundingClientRect();
    tip.style.left = (c.left - p.left + c.width / 2) + "px";
    tip.style.top = (c.top - p.top - 4) + "px";
    tip.classList.add("on");
  };
  plot.onmouseleave = () => tip.classList.remove("on");

  $("xax").innerHTML = `<span>${labelOfKey(days[0][0])}</span><span>${labelOfKey(days[13][0])}</span>`;
}

/* Столбики по дням недели: сразу видно, где расписание уже опубликовано. */
function renderDayChart(){
  const plot = $("plot"), tip = $("tip");
  if (!plot) return;
  const counts = DAYS.map(d => [d, GAMES.filter(m => m.date === d).length]);
  const max = Math.max(1, ...counts.map(c => c[1]));
  plot.innerHTML = counts.map(([d, v], i) =>
    `<div class="col" data-v="${v}" data-k="${d}" style="cursor:pointer" data-day="${i}"></div>`
      .replace("></div>", `><div class="fill"></div></div>`)).join("");
  const grow = () => plot.querySelectorAll(".col").forEach((c, i) => {
    const v = Number(c.dataset.v);
    c.querySelector(".fill").style.transitionDelay = REDUCED ? "0ms" : (i * 45) + "ms";
    c.querySelector(".fill").style.height = (v ? Math.max(6, Math.round(v / max * 100)) : 2) + "%";
  });
  REDUCED ? grow() : requestAnimationFrame(() => requestAnimationFrame(grow));
  plot.onmouseover = e => {
    const col = e.target.closest(".col"); if (!col) return;
    tip.innerHTML = `<b>${col.dataset.v}</b> \u00b7 ${labelOfKey(col.dataset.k)}`;
    const pr = plot.getBoundingClientRect(), cr = col.getBoundingClientRect();

    tip.style.top = (cr.top - pr.top - 4) + "px";

/* ─────────── Расписание ─────────── */
const DAYS = [...new Set(GAMES.map(m => m.date))].sort();

function dayLabelShort(iso){
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const now = new Date();
  const diff = Math.round((dt - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if (diff === 0) return t("today");
  if (diff === 1) return t("tomorrow");
  const week = LANG === "ru" ? ["вс","пн","вт","ср","чт","пт","сб"]
                             : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return week[dt.getDay()];
}

/* Основные турниры выше челленджеров, челленджеры выше ITF и UTR. */
const evtRank = name => /futures|itf|utr/i.test(name) ? 3 : /challenger/i.test(name) ? 2 : 1;

const dayGames = () => GAMES.filter(m => m.date === (DAYS[mday] || DAYS[0]));

function matchMatches(m){
  const q = query.trim().toLowerCase();
  if (filter === "men" && m.tour !== "atp") return false;
  if (filter === "women" && m.tour !== "wta") return false;
  if (!q) return true;
  return (m.p1.name + " " + m.p2.name + " " + m.event).toLowerCase().includes(q);
}

/* В счёте тай-брейк приклеен к геймам: «66» — это 6 и тай-брейк 6.
   Приписка бывает только при 6 или 7 геймах, поэтому «10» из решающего
   тай-брейка остаётся десяткой, а не превращается в единицу. */
const tb = v => { const x = String(v); return x.length > 1 && (x[0] === "6" || x[0] === "7"); };
const games = v => tb(v) ? Number(String(v)[0]) : Number(v);
const setCell = v => tb(v) ? String(v)[0] + "<sup>" + String(v).slice(1) + "</sup>" : String(v);

const wonSets = (sc, other) =>
  sc.filter((v, i) => games(v) > games(other[i] === undefined ? 0 : other[i])).length;

/* Счёт по сетам — в строке своего игрока, колонка к колонке, как на табло. */
function side(p, sc, other, win){
  const sets = sc.map((v, i) => {
    const better = games(v) > games(other[i] === undefined ? 0 : other[i]);
    return `<span class="st${better ? " w" : ""}">${setCell(v)}</span>`;
  }).join("");
  return `<div class="side${win ? " win" : ""}">
      <span class="flag"></span>
      <button class="nm" data-player="${p.slug}">${p.name}</button>
      ${p.seed ? `<span class="sd">(${p.seed})</span>` : ""}
      ${sets ? `<span class="sets">${sets}</span>` : ""}
    </div>`;
}

function renderMatches(){
  const rows = dayGames().filter(matchMatches);
  $("resultLine").textContent = `${rows.length} \u00b7 ${DAYS[mday] ? labelOfKey(DAYS[mday]) : ""}`;
  $("feedTitle").textContent = t("tabMatches");

  if (!rows.length){
    $("feedBody").innerHTML = `<div class="empty fade"><div class="big">${t("noMatches")}</div></div>`;
    return;
  }
  const byEvent = [];
  for (const m of rows){
    const last = byEvent[byEvent.length - 1];
    if (!last || last.key !== m.event + m.tour) byEvent.push({key:m.event + m.tour, m, list:[]});
    byEvent[byEvent.length - 1].list.push(m);
  }

  byEvent.sort((a, b) => evtRank(a.m.event) - evtRank(b.m.event));
  $("feedBody").innerHTML = byEvent.map(g => `
    <div class="evt">
      <span class="tour ${g.m.tour}">${g.m.tour.toUpperCase()}</span>
      <span class="name">${g.m.event}</span>
      <span class="ln"></span>
      <span class="n">${g.list.length}</span>
    </div>
    <div class="mtable">${g.list.map(m => `
      <div class="mrow">
        <span class="tm">${m.time || "\u2014"}</span>
        <div class="pair">${
          side(m.p1, m.s1, m.s2, wonSets(m.s1, m.s2) > wonSets(m.s2, m.s1))
        }${
          side(m.p2, m.s2, m.s1, wonSets(m.s2, m.s1) > wonSets(m.s1, m.s2))
        }</div>
        <div class="right">${!m.s1.length && m.odds.length === 2
          ? `<div class="od"><span>${m.odds[0]}</span><span>${m.odds[1]}</span></div>` : ""}</div>
      </div>`).join("")}</div>`).join("");
}

/* ─────────── Лента ─────────── */
let io = null;
function observe(cards){
  if (io) io.disconnect();
  io = new IntersectionObserver((entries, obs) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.style.transitionDelay = (Number(en.target.dataset.i) % 6) * 55 + "ms";
      en.target.classList.add("in");
      obs.unobserve(en.target);
    });
  }, {rootMargin:"0px 0px -8% 0px"});
  cards.forEach(c => io.observe(c));
}

function rankChip(n){
  if (n.rank === null) return "";
  const out = n.rank > 250 ? ` title="${t("outOfTop")}"` : "";
  return `<span class="rank${n.rank > 250 ? " out" : ""}"${out}>#${n.rank}</span>`;
}

        ${photo[1] ? `<div class="credit">${t("photoCredit")} \u00b7
          <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(photo[1])}"
             target="_blank" rel="noopener">${photo[1]}</a></div>` : ""}
      </div>
    </div>
    ${meter}${next}
    <p class="secTitle">${t("historySix")}</p>
    ${shown.length ? `<ul class="tl">${tl}</ul>` : `<p class="rnote">${t("noRecords")}</p>`}
    ${hidden > 0 ? `<p class="credit">${hidden} \u00b7 ${t("olderHidden")}</p>` : ""}
    ${n0 ? `<div class="acts">
      <button class="copy" data-copy="${idOf(n0)}">${t("copy")}</button>
      <a class="copy" href="${n0.src}" target="_blank" rel="noopener">${n0.srcName} &#8599;</a>
    </div>` : ""}`;
  $("mBody").style.setProperty("--k", c.k);
  $("modal").hidden = false;
  document.body.style.overflow = "hidden";
  $("mClose").title = t("close");
  $("mClose").focus();
  if (!fromHash) history.pushState(null, "", "#/player/" + encodeURIComponent(key));
}

function closeModal(silent){
  if ($("modal").hidden) return;
  $("modal").hidden = true;
  document.body.style.overflow = "";
  if (!silent && location.hash.indexOf("#/player") === 0) history.back();
}

/* ─────────── Адрес страницы ─────────── */
function writeHash(){
  const parts = [TAB];
  if (filter !== "all") parts.push(filter);
  const qs = [];
  if (query.trim()) qs.push("q=" + encodeURIComponent(query.trim()));
  if (LANG !== "en") qs.push("lang=" + LANG);
  const h = "#/" + parts.join("/") + (qs.length ? "?" + qs.join("&") : "");
  if (location.hash !== h) history.replaceState(null, "", h);
}

function applyHash(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const seg = path.split("/").filter(Boolean);
  const p = new URLSearchParams(qs || "");
  const lang = p.get("lang");
  if (lang === "ru" || lang === "en") LANG = lang;
  query = p.get("q") || "";

  if (seg[0] === "player"){
    renderAll();
    $("q").value = query;
    $("searchBox").classList.toggle("has", query !== "");
    openPlayer(decodeURIComponent(seg.slice(1).join("/")), true);
    return;
  }
  if (TABS.includes(seg[0])) TAB = seg[0];
  filter = kindsNow().includes(seg[1]) ? seg[1] : (TAB === "ranking" ? "men" : "all");
  closeModal(true);
  renderAll();
  $("q").value = query;
  $("searchBox").classList.toggle("has", query !== "");
}

/* ─────────── Статика ─────────── */
function renderStatic(){
  document.documentElement.lang = LANG;
  const set = (id, v) => $(id).textContent = v;
  const html = (id, v) => $(id).innerHTML = v;

  set("tagline", t("tagline"));
  $("q").placeholder = t("search");
  $("reset").title = t("clear");
  $("totop").title = t("top");
  set("liveLbl", t("live")); set("wireLbl", t("wire"));
  set("kicker", t("kicker")); html("heroTitle", t("heroTitle")); set("heroLead", t("heroLead"));
  set("ctaFeed", t("ctaFeed"));
  $("ctaTg").querySelector("span").textContent = t("ctaTg");
  $("tgCaption").textContent = t("tgCaption");
  set("idxTitle", t("index"));
  set("promoTitle", t("promoTitle")); set("promoLead", t("promoLead"));
  set("tgName", t("tgName")); set("tgGo", t("tgGo")); set("note", t("note")); set("footNote", t("footNote"));
  html("bullets", ["b1","b2","b3","b4"]
    .map((k,i) => `<li><span class="n">0${i+1}</span><span>${t(k)}</span></li>`).join(""));
  document.querySelectorAll(".seg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

  const old = daysAgo(UPDATED) >= 3;
  $("livePill").classList.toggle("stale", old);
  $("liveLbl").textContent = old ? t("stale") : t("live");
  $("livePill").title = t("updated") + ": " + UPDATED;
  $("updatedLine").textContent =
    t("updated") + ": " + labelOfKey(dayKey(UPDATED)) + ", " + UPDATED.split(" ")[1];
}

function renderAll(){
  renderStatic(); renderTabs(); renderTiles(); renderChart();
  renderFilters(); renderIndex(); renderWire(); renderFeed();
}

function flash(el){
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
}

/* ─────────── События ─────────── */
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")){ closeModal(); return; }

  const pl = e.target.closest("[data-player]");
  if (pl){ openPlayer(pl.dataset.player); return; }

  const cp = e.target.closest("[data-copy]");
  if (cp){
    const rec = NEWS.find(n => idOf(n) === cp.dataset.copy);
    if (rec) copyText(postText(rec));
    return;
  }

  const tb = e.target.closest("[data-tab]");
  if (tb && tb.dataset.tab !== TAB){
    TAB = tb.dataset.tab;
    filter = TAB === "ranking" ? "men" : "all";
    rankShown = 100;
    mday = Math.min(mday, Math.max(0, DAYS.length - 1));
    renderTabs(); renderTiles(); renderChart();
    renderFilters(); renderIndex(); renderFeed();
    flash($("feedBody")); writeHash();
    return;
  }

  const dayBtn = e.target.closest("[data-day]");
  if (dayBtn){
    mday = Number(dayBtn.dataset.day);
    renderTiles(); renderChart(); renderFilters(); renderIndex(); renderFeed(); writeHash();
    return;
  }

  if (e.target.id === "rankMore"){ rankShown += 100; renderRanking(); return; }

  const chip = e.target.closest("[data-kind]");
  if (chip){
    filter = chip.dataset.kind; rankShown = 100;
    renderTiles(); renderFilters(); renderFeed(); writeHash();
    return;
  }

  const st = e.target.closest("[data-star]");
  if (st){
    const id = st.dataset.star, on = !starred.has(id);
    on ? starred.add(id) : starred.delete(id);
    st.setAttribute("aria-pressed", String(on));
    st.textContent = on ? "★" : "☆";
    st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop");
    renderFilters();
    if (filter === "starred") renderFeed(false);
    return;
  }

  const nm = e.target.closest("[data-name]");
  if (nm){
    query = nm.dataset.name; filter = "all";
    $("q").value = query; $("searchBox").classList.add("has");
    renderFilters(); renderFeed(); writeHash();
    $("feed").scrollIntoView({behavior:REDUCED ? "auto" : "smooth", block:"start"});
    return;
  }

  const lg = e.target.closest(".seg button");
  if (lg && lg.dataset.lang !== LANG){
    LANG = lg.dataset.lang;
    renderAll(); flash($("feedBody")); writeHash();
    return;
  }

  if (e.target.id === "reset"){
    query = ""; filter = "all";
    $("q").value = ""; $("searchBox").classList.remove("has");
    renderFilters(); renderFeed(); writeHash();
  }

  if (e.target.id === "totop") scrollTo({top:0, behavior:REDUCED ? "auto" : "smooth"});
});

/* Перерисовываем только ленту: полный ререндер сбрасывал бы фокус в поле поиска. */
$("q").addEventListener("input", e => {
  query = e.target.value;
  $("searchBox").classList.toggle("has", query !== "");
  renderFeed(false);
  clearTimeout(window.qt);
  window.qt = setTimeout(writeHash, 400);
});

addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
addEventListener("popstate", applyHash);
addEventListener("hashchange", applyHash);

/* Панель фильтров липнет ровно под шапкой, какой бы высоты та ни была. */
function syncBarHeight(){
  const bar = $("bar").offsetHeight;
  document.documentElement.style.setProperty("--barh", bar + "px");
  document.documentElement.style.setProperty("--stick", (bar + $("nav").offsetHeight) + "px");
}
addEventListener("resize", syncBarHeight);
$("bar").addEventListener("transitionend", syncBarHeight);   // шапка сжимается плавно
addEventListener("scroll", () => {
  const y = scrollY, h = document.body.scrollHeight - innerHeight;
  $("progress").style.width = (h > 0 ? (y / h) * 100 : 0) + "%";
  const stuck = y > 8;
  if (stuck !== $("bar").classList.contains("stuck")){
    $("bar").classList.toggle("stuck", stuck);
    syncBarHeight();            // шапка при скролле сжимается — меню должно поехать следом
  }
  $("totop").classList.toggle("on", y > 600);
}, {passive:true});

applyHash();
writeHash();
syncBarHeight();
</script>
</body>
</html>
