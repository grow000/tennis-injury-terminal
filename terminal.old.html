<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Injury Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f2f3; --surface:#e9e9ea; --card:#fbfbfc;
    --text:#1d1f20; --accent:#5980a6; --accent-700:#416180;
    --n300:#d4d4d7; --n500:#98989b; --n600:#7a7a7d; --n700:#5d5d60; --n900:#2b2b2d;
    --divider:color-mix(in srgb, #1d1f20 14%, transparent);
    --alert:#a33b32;
    --head:"Oswald","Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans","Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font:14px/1.55 var(--body);
    display:grid; grid-template-rows:auto auto 1fr; height:100vh; overflow:hidden;
  }
  .mono{font-variant-numeric:tabular-nums}

  .top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:24px;padding:11px 20px;border-bottom:1px solid var(--divider)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{width:30px;height:30px;border:1px solid var(--accent);display:grid;place-items:center;flex:none}
  .mark i{width:12px;height:12px;border:1px solid var(--accent);border-radius:50%}
  .brand .t{font-family:var(--head);font-weight:600;font-size:20px;line-height:1;text-transform:uppercase;display:block}
  .brand .s{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n700)}

  .find{display:flex;align-items:center;gap:8px;max-width:520px;width:100%;justify-self:center}
  .find input{flex:1;background:var(--card);border:1px solid var(--divider);color:var(--text);
    padding:8px 12px;font:14px var(--body)}
  .find input:focus{outline:1px solid var(--accent)}
  .find button{background:none;border:1px solid var(--divider);color:var(--n700);
    padding:8px 11px;cursor:pointer;font:12px var(--body);letter-spacing:.05em;text-transform:uppercase}

  .right{display:flex;align-items:center;gap:14px}
  .live{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--n700)}
  .live i{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .lang button{background:none;border:1px solid var(--divider);padding:6px 10px;cursor:pointer;
    font:12px var(--body);color:var(--n600)}
  .lang button[aria-pressed="true"]{background:var(--n900);color:#fff;border-color:var(--n900)}

  .wire{display:flex;align-items:center;gap:14px;padding:7px 20px;
    background:var(--surface);border-bottom:1px solid var(--divider);overflow:hidden}
  .wire .lbl{font-family:var(--head);font-size:12px;letter-spacing:.08em;color:var(--accent);flex:none}
  .track{display:flex;gap:36px;white-space:nowrap;animation:marquee 42s linear infinite}
  .track:hover{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .track span{font-size:12.5px;color:var(--n700)}
  .track b{color:var(--text);font-weight:600}

  .main{display:grid;grid-template-columns:230px 1fr 300px;min-height:0;overflow:hidden}
  .side,.feedcol,.promo{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .side{border-right:1px solid var(--divider);overflow-y:auto}
  .promo{border-left:1px solid var(--divider);overflow-y:auto;background:var(--surface)}

  .block{padding:14px 16px;border-bottom:1px solid var(--divider)}
  .block h3{font-family:var(--head);font-size:12px;letter-spacing:.09em;color:var(--n700);
    margin-bottom:9px;text-transform:uppercase;font-weight:600}

  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
  .stat .v{font-family:var(--head);font-size:19px}
  .stat .l{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--n600)}

  .fl{display:flex;justify-content:space-between;align-items:center;width:100%;
    background:none;border:none;padding:6px 0;cursor:pointer;font:13.5px var(--body);color:var(--n700)}
  .fl:hover{color:var(--text)}
  .fl[aria-pressed="true"]{color:var(--accent);font-weight:600}
  .fl .c{font-size:12px;color:var(--n500);font-variant-numeric:tabular-nums}

  .idx{display:flex;flex-wrap:wrap;gap:5px}
  .idx button{background:var(--card);border:1px solid var(--divider);padding:3px 7px;
    cursor:pointer;font:12px var(--body);color:var(--n700)}
  .idx button:hover{border-color:var(--accent);color:var(--accent)}

  .fhead{display:flex;justify-content:space-between;align-items:baseline;
    padding:11px 18px;border-bottom:1px solid var(--divider)}
  .fhead .t{font-family:var(--head);font-size:15px;text-transform:uppercase}
  .fhead .m{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--n600)}
  .feed{flex:1;min-height:0;overflow-y:auto}
  .day{display:flex;justify-content:space-between;padding:6px 18px;background:var(--surface);
    border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:1}
  .day .d{font-family:var(--head);font-size:12px;letter-spacing:.07em;text-transform:uppercase}
  .day .n{font-size:11.5px;color:var(--n600)}

  .row{display:grid;grid-template-columns:52px 138px 1fr 26px;gap:14px;
    padding:12px 18px;border-bottom:1px solid var(--divider);align-items:start}
  .row:hover{background:var(--card)}
  .row .time{font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums}
  .row .who{font-family:var(--head);font-size:14px;line-height:1.25;text-transform:uppercase}
  .row .who .code{display:block;font-family:var(--body);font-size:11px;
    letter-spacing:.06em;color:var(--accent)}
  .row .txt{font-size:13.5px}
  .row .txt .flag{color:var(--alert);font-weight:600}
  .row .src{margin-top:5px;font-size:12px;display:block}
  .row .src a{color:var(--accent);text-decoration:none}
  .row .src a:hover{text-decoration:underline}
  .star{background:none;border:none;cursor:pointer;font-size:15px;color:var(--n300);line-height:1}
  .star[aria-pressed="true"]{color:var(--accent)}
  .empty{padding:26px 18px;color:var(--n600)}

  .promo .inner{padding:16px}
  .promo .lead{font-size:14.5px;line-height:1.45;margin-bottom:14px}
  .tg{display:block;background:var(--accent);color:#fff;text-decoration:none;
    padding:14px;text-align:center;margin-bottom:14px}
  .tg:hover{background:var(--accent-700)}
  .tg svg{width:38px;height:38px;fill:currentColor}
  .tg .n{font-family:var(--head);font-size:16px;margin-top:6px}
  .tg .g{font-size:12px;opacity:.9}
  .bul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--n700)}
  .bul b{color:var(--text)}
  .bul .n{color:var(--accent);font-family:var(--head);margin-right:6px}
  .note{margin-top:14px;font-size:12px;color:var(--n600);line-height:1.5}

  .chart{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:8px}
  .chart div{flex:1;background:var(--accent);opacity:.75;min-height:2px}
  .chart div:hover{opacity:1}
  .chartx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--n500);margin-top:4px}

  @media (max-width:1000px){
    body{overflow:auto;height:auto;display:block}
    .main{grid-template-columns:1fr}
    .side,.promo{border:none;border-bottom:1px solid var(--divider)}
    .row{grid-template-columns:48px 1fr 26px}
    .row .who,.row .txt{grid-column:2}
    .top{grid-template-columns:1fr;gap:10px}
    .find{max-width:none}
  }
</style>
</head>

</div>

const KINDS = ["all","injury","withdrawal","returning","condition","starred"];
let filter = "all", query = "";
const starred = new Set();

const nameOf = n => (LANG === "ru" && n.whoRu) ? n.whoRu : n.who;
const idOf = n => n.ts + n.who;
const dayKey = ts => ts.split(" ")[0];

function daysAgo(ts){
  const d = new Date(ts.replace(" ", "T"));
  return Math.max(0, Math.round((Date.now() - d) / 86400000));
}
function dayLabel(ts){
  const [y,m,d] = dayKey(ts).split("-");
  return `${Number(d)} ${UI[LANG].months[Number(m)-1]} ${y}`;
}

function match(n){
  const q = query.trim().toLowerCase();
  if (filter === "starred" && !starred.has(idOf(n))) return false;
  if (filter !== "all" && filter !== "starred" && n.kind !== filter) return false;
  if (!q) return true;
  return n.who.toLowerCase().includes(q) ||
         (n.whoRu || "").toLowerCase().includes(q) ||
         n[LANG].toLowerCase().includes(q);
}

function renderStats(){
  const rows = [
    ["sTotal", NEWS.length],
    ["sPlayers", new Set(NEWS.map(n => n.who)).size],
    ["sInj", NEWS.filter(n => n.kind === "injury").length],
    ["sWd", NEWS.filter(n => n.kind === "withdrawal").length],
  ];
  document.getElementById("stats").innerHTML = rows.map(([k,v]) =>
    `<div class="stat"><span class="l">${t(k)}</span><span class="v mono">${v}</span></div>`).join("");
}

function renderFilters(){
  document.getElementById("filters").innerHTML = KINDS.map(k => {
    const count = k === "all" ? NEWS.length
      : k === "starred" ? starred.size
      : NEWS.filter(n => n.kind === k).length;
    return `<button class="fl" data-kind="${k}" aria-pressed="${k === filter}">
        <span>${t(k)}</span><span class="c">${count}</span></button>`;
  }).join("");
}

function renderIndex(){
  const by = {};
  for (const n of NEWS) by[nameOf(n)] = (by[nameOf(n)] || 0) + 1;
  document.getElementById("index").innerHTML = Object.entries(by)
    .sort((a,b) => b[1] - a[1])
    .map(([name,c]) => `<button data-name="${name}">${name} ${c}</button>`).join("");
}

/* Столбики по дням: сразу видно, когда шла волна снятий. */
function renderChart(){
  const days = [];
  for (let i = 13; i >= 0; i--){
    const key = new Date(Date.now() - i * 86400000).toISOString().slice(0,10);
    days.push([key, NEWS.filter(n => dayKey(n.ts) === key).length]);
  }
  const max = Math.max(1, ...days.map(d => d[1]));
  document.getElementById("chart").innerHTML = days.map(([k,v]) =>
    `<div style="height:${Math.round(v / max * 100)}%" title="${k}: ${v}"></div>`).join("");
  const f = days[0][0].split("-"), l = days[13][0].split("-");
  document.getElementById("chartx").innerHTML =
    `<span>${Number(f[2])} ${UI[LANG].months[Number(f[1])-1]}</span>` +
    `<span>${Number(l[2])} ${UI[LANG].months[Number(l[1])-1]}</span>`;
}

function renderWire(){
  const items = NEWS.slice(0, 8).map(n =>
    `<span><b>${nameOf(n)}</b> · ${n.code} · ${UI[LANG].ago(daysAgo(n.ts))}</span>`).join("");
  document.getElementById("track").innerHTML = items + items;
}

function renderFeed(){
  const rows = NEWS.filter(match).sort((a,b) => b.ts.localeCompare(a.ts));
  document.getElementById("resultLine").textContent =
    `${rows.length} ${t("records")} · ${t("sorted")}`;
  document.getElementById("feedTitle").textContent = t(filter);

  if (!rows.length){
    document.getElementById("feed").innerHTML = `<div class="empty">${t("empty")}</div>`;
    return;
  }
  let html = "", last = "";
  for (const n of rows){
    if (dayKey(n.ts) !== last){
      last = dayKey(n.ts);
      const cnt = rows.filter(r => dayKey(r.ts) === last).length;
      html += `<div class="day"><span class="d">${dayLabel(n.ts)}</span>` +
              `<span class="n">${cnt} ${t("records")} · ${UI[LANG].ago(daysAgo(n.ts))}</span></div>`;
    }
    const id = idOf(n);
    html += `<div class="row">
        <span class="time">${n.ts.split(" ")[1]}</span>
        <span class="who">${nameOf(n)}<span class="code">${n.code}</span></span>
        <span class="txt">${n[LANG]}
          <span class="src"><a href="${n.src}" target="_blank" rel="noopener">${n.srcName} ↗</a></span>
        </span>
        <button class="star" data-star="${id}" aria-pressed="${starred.has(id)}">${starred.has(id) ? "★" : "☆"}</button>
      </div>`;
  }
  document.getElementById("feed").innerHTML = html;
}

function renderStatic(){
  document.documentElement.lang = LANG;
  const set = (id, val) => document.getElementById(id).textContent = val;
  set("tagline", t("tagline"));
  document.getElementById("q").placeholder = t("search");
  set("reset", t("reset")); set("liveLbl", t("live")); set("wireLbl", t("wire"));
  set("sumTitle", t("summary")); set("filterTitle", t("filter"));
  set("idxTitle", t("index")); set("chartTitle", t("chart"));
  set("promoLead", t("promoLead")); set("tgGo", t("tgGo")); set("note", t("note"));
  document.getElementById("bullets").innerHTML = ["b1","b2","b3","b4"]
    .map((k,i) => `<li><span class="n">0${i+1}</span>${t(k)}</li>`).join("");
  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}

function render(){
  renderStatic(); renderStats(); renderFilters();
  renderIndex(); renderChart(); renderWire(); renderFeed();
}

document.addEventListener("click", e => {
  const f = e.target.closest("[data-kind]");
  if (f){ filter = f.dataset.kind; render(); return; }

  const st = e.target.closest("[data-star]");
  if (st){
    const id = st.dataset.star;
    starred.has(id) ? starred.delete(id) : starred.add(id);
    render(); return;
  }

  const nm = e.target.closest("[data-name]");
  if (nm){
    query = nm.dataset.name; filter = "all";
    document.getElementById("q").value = query; render(); return;
  }

  const lg = e.target.closest(".lang button");
  if (lg){ LANG = lg.dataset.lang; render(); return; }

  if (e.target.id === "reset"){
    query = ""; filter = "all";
    document.getElementById("q").value = ""; render();
  }
});

/* Перерисовываем только ленту: полная перерисовка сбрасывала бы
   фокус в поле поиска на каждом набранном символе. */
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value; renderFeed();
});

render();
</script>
