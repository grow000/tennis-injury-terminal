<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#0b0b0b;color:#fff;
    font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;position:relative}
  .glow{position:absolute;width:820px;height:820px;right:-240px;top:-260px;border-radius:50%;
    background:radial-gradient(circle,rgba(42,120,214,.45),transparent 62%)}
  .glow2{position:absolute;width:520px;height:520px;left:-200px;bottom:-260px;border-radius:50%;
    background:radial-gradient(circle,rgba(208,59,59,.22),transparent 65%)}
  .in{position:relative;height:100%;padding:64px 68px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:16px}
  .mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(145deg,#2a78d6,#184f95)}
  .mark svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8}
  .brand{font-family:"Oswald",sans-serif;font-size:26px;letter-spacing:.03em;text-transform:uppercase}
  .kick{margin-top:auto;font-family:"Oswald",sans-serif;font-size:17px;letter-spacing:.22em;
    text-transform:uppercase;color:#cde2fb;display:flex;align-items:center;gap:14px}
  .kick::before{content:"";width:44px;height:1px;background:#2a78d6}
  h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:76px;line-height:1;
    text-transform:uppercase;margin:18px 0 22px;letter-spacing:-.01em}
  h1 b{color:#5598e7;font-weight:600}
  .sub{font-size:23px;color:rgba(255,255,255,.66);max-width:26ch}
  .row{display:flex;gap:12px;margin-top:34px;align-items:center}
  .pill{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 20px;
    font-size:17px;color:rgba(255,255,255,.82)}
  .pill.on{background:#2a78d6;border-color:#2a78d6;color:#fff;font-weight:600}
  .tg{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:20px;
    color:rgba(255,255,255,.8)}
  .tg svg{width:30px;height:30px;fill:#2a78d6}
</style>
</head>
<body>
<div class="glow"></div><div class="glow2"></div>
<div class="in">
  <div class="top">
    <span class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M4.6 5.8c3.4 2.6 4.6 8.6 2.4 12.9M19.4 5.8c-3.4 2.6-4.6 8.6-2.4 12.9"/></svg></span>
    <span class="brand">Tennis Injury Terminal</span>
  </div>

  <span class="kick">ATP &amp; WTA · топ-250</span>
  <h1>Кто <b>травмирован</b>,<br>кто снялся,<br>кто вернулся.</h1>
  <div class="sub">Травмы, снятия и медицинские перерывы — со ссылкой на источник по каждой записи.</div>

  <div class="row">
    <span class="pill on">ATP</span>
    <span class="pill on">WTA</span>
    <span class="pill">Снятия</span>
    <span class="pill">Против кого ставить</span>
    <span class="tg">
      <svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19c-.2 1-.9 1.3-1.8.8l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.1 12.6l-4.8-1.5c-1-.3-1-1 .2-1.5l18.9-7.3c.9-.3 1.6.2 1.5 2z"/></svg>
      @tennismedical
    </span>
  </div>
</div>
</body>
</html>
